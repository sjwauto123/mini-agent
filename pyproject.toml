[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "portalocker>=3,<4",
  "tzdata>=2025.2,<2027",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.48"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
# 只做静态检查，不接管格式化：`ruff format` 会重排现有的紧凑写法与行内中文注释，
# 需要单独评估后再开。
target-version = "py311"
# 120 字符：中文注释一个字符占两格宽度，再长就得上横向滚动条。
line-length = 120

[tool.ruff.lint]
# 显式写出采用的规则集，避免"依赖默认值"变成隐性约定：
#   E4 import 位置 · E5 行长度 · E7 语句写法 · E9 语法错误 · F pyflakes（未使用导入 / 未定义名字）。
select = ["E4", "E5", "E7", "E9", "F"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
