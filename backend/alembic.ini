# Alembic configuration.
# NOTE: this file is read by Alembic with the *locale* encoding on Windows (GBK here),
# so keep every comment ASCII-only -- non-ASCII text breaks config parsing.
# The real connection URL is injected at runtime by migrations/env.py; the value below is a fallback.
[alembic]
# Directory holding the migration scripts (paths are relative to the repository root).
script_location = backend/migrations
# Make the mini_agent package importable from migration scripts.
prepend_sys_path = backend
path_separator = os
# Fallback URL: env.py prefers an injected connection_url or MINI_AGENT_MIGRATION_URL.
sqlalchemy.url = sqlite:///./.mini-agent/state.db

# --- Logging: only Alembic itself should talk; keep SQLAlchemy quiet during migrations ---
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
